plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.8'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pgc'
version = '0.0.1-SNAPSHOT'
description = 'myonbid'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 1. [Web] 웹 서버 구축을 위한 핵심
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation' // 유효성 검증 (@Valid)

    // 2. [Database] JPA & MyBatis & MariaDB
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    implementation 'org.springframework.boot:spring-boot-starter-webflux' // web client
    testImplementation 'io.projectreactor:reactor-test'// MyBatis 연동
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client' // MariaDB 드라이버

    // 3. [Batch] 대용량 데이터 처리 (공공데이터 수집용)
    implementation 'org.springframework.boot:spring-boot-starter-batch'

    // 4. [Security & Auth] 로그인 및 권한 관리
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // JWT 라이브러리 (로그인 토큰 생성용)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // 5. [API Docs] Swagger (자동 API 명세서)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // 6. [Utils] 개발 편의성 및 XML 처리
    compileOnly 'org.projectlombok:lombok' // 코드 단축
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-aop' // AOP (로깅 등)

    // ★ 중요: 공공데이터(XML) 파싱을 위한 라이브러리
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'

    // 7. [Test] 테스트 코드 작성
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
